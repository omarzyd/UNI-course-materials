<text x="150" y="240" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="middle">needs the model p(s', r | s, a)</text>
<text x="450" y="24" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">MC</text>
<text x="450" y="44" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="middle">one path, all the way to the end</text>
