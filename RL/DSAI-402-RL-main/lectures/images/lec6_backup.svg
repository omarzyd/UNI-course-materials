<text x="750" y="24" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">TD(0)</text>
<text x="750" y="44" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="middle">one step, one path, uses V(s')</text>
