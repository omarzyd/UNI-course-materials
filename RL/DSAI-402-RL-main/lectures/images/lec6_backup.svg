<text x="764" y="145" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#52514e" text-anchor="start">A</text>
<text x="768" y="166" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#52514e" text-anchor="start">R</text>
<text x="768" y="205" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#111111" text-anchor="start">S'   (we use V(S'))</text>
<text x="750" y="240" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="middle">no model needed</text>
