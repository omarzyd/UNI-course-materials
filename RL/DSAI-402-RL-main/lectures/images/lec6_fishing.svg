<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="The fishing trip: at the dock, fish at the shore for 1 fish, or row to the lake and fish there for 4 fish on heads and none on tails">
<title>The fishing trip</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="30" y="112" width="140" height="58" rx="10" fill="#fff6c7" stroke="#e3cf72" stroke-width="1.4"/>
<text x="100.0" y="147.0" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="18" fill="#111111" text-anchor="middle">Dock</text>
<rect x="310" y="112" width="140" height="58" rx="10" fill="#dbeafc" stroke="#9cc3ee" stroke-width="1.4"/>
<text x="380.0" y="147.0" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="18" fill="#111111" text-anchor="middle">Lake</text>
<rect x="590" y="112" width="140" height="58" rx="10" fill="#e6f6ee" stroke="#9fd9b9" stroke-width="1.4"/>
<text x="660.0" y="147.0" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="18" fill="#111111" text-anchor="middle">End of day</text>
<path d="M100,108 C200,26 560,26 660,106" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<text x="380" y="34" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">fish at the shore: +1</text>
<line x1="174" y1="141.0" x2="304" y2="141.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<text x="240" y="131.0" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">row: 0</text>
<line x1="454" y1="141.0" x2="584" y2="141.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<text x="520" y="131.0" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">fish</text>
<text x="520" y="196" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#52514e" text-anchor="middle">heads: +4</text>
<text x="520" y="216" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#52514e" text-anchor="middle">tails: 0</text>
<text x="100" y="196" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#52514e" text-anchor="middle">start of the day</text>
</svg>